name: Feature request
description: Suggest a policy, deployment, or usability improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What operational problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Standard tier
        - Hardened tier
        - Installer / sync
        - Documentation
        - CI / release engineering
        - Other
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Compatibility or false-positive considerations
